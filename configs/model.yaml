target: load_mw
timezone: America/Chicago

eia:
  route: electricity/rto/region-sub-ba-data
  parent_ba: PJM
  subregion: null # set after running `make find-comed` (see docs/decisions/0002)
  start: 2018-07-01 # first month of EIA-930 subregion data

weather:
  # Which Open-Meteo archives to ingest (see docs/decisions/0003). Each lands in
  # data/raw/weather/source=<name>/.
  sources:
    previous_runs: # forecasts as issued 1 and 2 days ahead: main training features
      start: 2022-01-01
      lead_days: [1, 2]
    era5: # reanalysis ("actual" weather): ablation and long-run climatology
      start: 2018-07-01
  # Open-Meteo variable -> our column name (units are in the name and checked on ingest)
  variables:
    temperature_2m: temp_f
    dew_point_2m: dew_point_f
    apparent_temperature: apparent_temp_f
    relative_humidity_2m: rh_pct
    wind_speed_10m: wind_mph
    cloud_cover: cloud_cover_pct

ingest:
  incremental_lookback_days: 7 # re-fetch this many recent days to pick up revisions and lag

backtest:
  # Rolling-origin backtest (Phase 4). Train on everything from train_start up to each
  # month, forecast that month, then roll forward one month.
  train_start: 2022-01-01 # first full year of archived weather forecasts (ADR 0003)
  min_train_months: 12 # first test month comes after this much training data
  holdout_months: 12 # the final 12 months are never used before Phase 6
  min_eval_hours_per_day: 20 # a day needs this many scored hours to count for peak error

models:
  lightgbm: # Phase 5. Tune only on the backtest folds, never the holdout (ADR 0007).
    interval: 0.8 # central prediction interval (10%-90%)
    calibration_days: 60 # most recent training days held back to calibrate intervals (CQR)
    params:
      n_estimators: 800
      learning_rate: 0.03
      num_leaves: 63
      min_child_samples: 40
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_lambda: 1.0
      random_state: 42

mlflow:
  tracking_uri: sqlite:///mlruns/mlflow.db
  artifact_location: mlruns/artifacts
  experiment: day-ahead-backtest

forecast:
  issue_hour_local: 10 # forecasts issued at 10:00 Central for the next day
  horizon_hours: 48
  min_lag_hours: 48 # no load lag shorter than this (leakage guard)
