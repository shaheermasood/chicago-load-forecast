version: 2

seeds:
  - name: holidays
    description: >
      US federal and Illinois holidays (observed dates) plus bridge days. Generated by
      scripts/make_seeds.py; don't edit by hand.
    columns:
      - name: holiday_tier
        data_tests:
          - accepted_values:
              arguments: { values: [major, minor, bridge] }
  - name: weather_points
    description: >
      Weather point weights, generated from configs/weather_points.yaml by
      scripts/make_seeds.py.
    columns:
      - name: point
        data_tests: [unique, not_null]
